<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dashboard - RIZQY PROJECT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; border: 1px solid #334155; }
        h2 { color: #00f2fe; margin-bottom: 20px; font-size: 22px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; outline: none; }
        input:focus { border-color: #00f2fe; }
        button { width: 100%; padding: 12px; background: #00f2fe; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .err { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
        .btn-zone { display: flex; gap: 10px; margin-top: 20px; }
        .btn-on { background: #10b981; color: white; }
        .btn-off { background: #ef4444; color: white; }
        .status-box { margin-top: 15px; font-weight: bold; font-size: 18px; padding: 10px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; }
    </style>
</head>
<body>

<div id="login-screen" class="box">
    <h2>🔐 LOGIN ONLINE SYSTEM</h2>
    <input type="text" id="online-user" placeholder="Username Online">
    <input type="password" id="online-pass" placeholder="Password Online">
    <button onclick="cekLoginOnline()">MASUK KE PANEL</button>
    <div id="error-login" class="err">❌ Username atau Password Salah!</div>
</div>

<div id="dashboard-screen" class="box" style="display: none;">
    <h2>🌐 CONTROL ONLINE CENTER</h2>
    <div class="status-box">STATUS ALAT: <span id="txt-status" style="color: #64748b;">CONNECTING...</span></div>
    <div class="btn-zone">
        <button class="btn-on" onclick="kirimPerintahMQTT('ON')">NYALAKAN</button>
        <button class="btn-off" onclick="kirimPerintahMQTT('OFF')">MATIKAN</button>
    </div>
</div>

<script>
// Variabel Kredensial untuk dicocokkan di Web
const validUser = "rizqy";
const validPass = "1234";

// Variabel Konfigurasi MQTT
const mqtt_broker = "broker.emqx.io";
const mqtt_port = 8083; // Menggunakan WebSocket port untuk Web Browser
const tx_topic = "rizqy_toi1_secure_control_77";
const rx_topic = "rizqy_toi1_secure_status_77";

let mqttClient;
let userTerinput = "";
let passTerinput = "";

function cekLoginOnline() {
    const u = document.getElementById('online-user').value;
    const p = document.getElementById('online-pass').value;
    const err = document.getElementById('error-login');

    if (u === validUser && p === validPass) {
        userTerinput = u;
        passTerinput = p;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        initMQTT(); // Hubungkan ke MQTT setelah sukses login
    } else {
        err.style.display = 'block';
    }
}

function initMQTT() {
    const clientId = "WebClient-" + Math.floor(Math.random() * 10000);
    mqttClient = new Paho.MQTT.Client(mqtt_broker, Number(mqtt_port), clientId);

    mqttClient.onConnectionLost = function(responseObject) {
        document.getElementById('txt-status').innerText = "DISCONNECTED";
        document.getElementById('txt-status').style.color = "#ef4444";
        setTimeout(initMQTT, 3000); // Auto reconnect
    };

    mqttClient.onMessageArrived = function(message) {
        if(message.destinationName === rx_topic) {
            const status = message.payloadString;
            const txt = document.getElementById('txt-status');
            txt.innerText = status;
            if(status === "ON") txt.style.color = "#10b981";
            else txt.style.color = "#ef4444";
        }
    };

    mqttClient.connect({
        onSuccess: function() {
            mqttClient.subscribe(rx_topic);
            // Request status aktual ke ESP
            let reqMsg = new Paho.MQTT.Message("STATUS_REQ");
            reqMsg.destinationName = tx_topic;
            mqttClient.send(reqMsg);
        }
    });
}

function kirimPerintahMQTT(cmd) {
    if(!mqttClient || !mqttClient.isConnected()) return;
    // Mengemas payload aman: "username|password|perintah"
    const securedPayload = userTerinput + "|" + passTerinput + "|" + cmd;
    
    let message = new Paho.MQTT.Message(securedPayload);
    message.destinationName = tx_topic;
    mqttClient.send(message);
}
</script>
</body>
</html>
