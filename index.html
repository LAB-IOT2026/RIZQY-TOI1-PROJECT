<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEPAN-LED IoT Control Center</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
        .container { max-width: 450px; margin: auto; }
        
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); margin-bottom: 20px; text-align: center; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 5px; color: #00f2fe; }
        h3 { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #38bdf8; }
        hr { border: 0; height: 1px; background: #334155; margin: 15px 0; }
        
        /* Jam Realtime */
        .clock-box { font-size: 32px; font-weight: 800; color: #00f2fe; background: #0f172a; padding: 12px; border-radius: 10px; margin: 10px 0; font-family: 'Courier New', Courier, monospace; border: 1px solid #334155; letter-spacing: 2px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
        .date-box { font-size: 13px; color: #94a3b8; margin-bottom: 5px; }

        /* Indikator */
        .indicator-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px 0; font-weight: 700; font-size: 16px; }
        .indicator-dot { width: 20px; height: 20px; border-radius: 50%; background-color: #64748b; display: inline-block; transition: all 0.4s ease; }
        .status-on { background-color: #10b981; box-shadow: 0 0 15px #10b981; }
        .status-off { background-color: #ef4444; box-shadow: 0 0 15px #ef4444; }

        /* Tombol Kontrol */
        .btn-group { display: flex; justify-content: space-between; gap: 10px; }
        .btn { flex: 1; padding: 14px; font-size: 15px; font-weight: 700; text-align: center; border-radius: 8px; color: #0f172a; cursor: pointer; border: none; transition: all 0.2s ease; }
        .btn-on { background: linear-gradient(to right, #10b981, #059669); color: white; }
        .btn-off { background: linear-gradient(to right, #ef4444, #dc2626); color: white; }
        .btn-submit { background: linear-gradient(to right, #00f2fe, #4facfe); width: 100%; margin-top: 15px; color: #0f172a; font-weight: 700; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); opacity: 0.95; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .status-box { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 15px; text-align: center; background-color: #334155; color: #cbd5e1; border: 1px solid #475569; }
        
        /* Baris Input Timer */
        .timer-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 10px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; }
        .timer-row span { font-weight: 600; font-size: 14px; color: #e2e8f0; }
        .timer-row label { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 5px; }
        .timer-row input[type="time"] { padding: 6px; border: 1px solid #334155; background: #1e293b; color: white; border-radius: 6px; font-size: 13px; outline: none; }
        .timer-row input[type="time"]:focus { border-color: #00f2fe; }
        #sync-text { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🌐 KONTROL UTAMA</h2>
        <div class="clock-box" id="live-clock">00:00:00</div>
        <div class="date-box" id="live-date">Memuat tanggal...</div>
        <hr>
        
        <div class="indicator-container">
            <span id="lamp-dot" class="indicator-dot"></span>
            <span id="lamp-text">STATUS: SINKRONISASI...</span>
        </div>

        <div class="status-box" id="status-display">Menghubungkan ke Broker HiveMQ...</div>
        
        <div class="btn-group">
            <button onclick="kirimPerintah('ON')" class="btn btn-on" id="btn-nyala" disabled>NYALAKAN</button>
            <button onclick="kirimPerintah('OFF')" class="btn btn-off" id="btn-mati" disabled>MATIKAN</button>
        </div>
    </div>

    <div class="card">
        <h3>⚙️ JADWAL OTOMATIS (4 SET)</h3>
        <p id="sync-text">Menunggu sinkronisasi jadwal dengan alat...</p>
        <hr>
        
        <form id="timer-form" onsubmit="simpanJadwal(event)">
            <div class="timer-row">
                <span>Set 1</span>
                <label>ON <input type="time" id="on1"></label>
                <label>OFF <input type="time" id="off1"></label>
            </div>
            <div class="timer-row">
                <span>Set 2</span>
                <label>ON <input type="time" id="on2"></label>
                <label>OFF <input type="time" id="off2"></label>
            </div>
            <div class="timer-row">
                <span>Set 3</span>
                <label>ON <input type="time" id="on3"></label>
                <label>OFF <input type="time" id="off3"></label>
            </div>
            <div class="timer-row">
                <span>Set 4</span>
                <label>ON <input type="time" id="on4"></label>
                <label>OFF <input type="time" id="off4"></label>
            </div>
            
            <button type="submit" class="btn btn-submit" id="btn-save" disabled>💾 SIMPAN SEMUA JADWAL</button>
        </form>
    </div>
</div>

<script>
    // --- JAM DIGITAL ---
    function updateJam() {
        const sekarang = new Date();
        const jam = String(sekarang.getHours()).padStart(2, '0');
        const menit = String(sekarang.getMinutes()).padStart(2, '0');
        const detik = String(sekarang.getSeconds()).padStart(2, '0');
        document.getElementById('live-clock').innerText = `${jam}:${menit}:${detik}`;
        const opsi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('live-date').innerText = sekarang.toLocaleDateString('id-ID', opsi);
    }
    setInterval(updateJam, 1000);
    updateJam();

    // --- MQTT CONFIGURATION ---
    const topikKontrol = "nepanled1";
    const topikStatus = "nepanled1/status"; 
    const topikJadwalStatus = "nepanled1/jadwal_status"; 
    
    const brokerUrl = "wss://broker.hivemq.com:8884/mqtt"; 
    const clientId = "client_gh_" + Math.random().toString(16).substr(2, 8);
    const client = mqtt.connect(brokerUrl, { clientId: clientId });

    const dotElement = document.getElementById('lamp-dot');
    const textElement = document.getElementById('lamp-text');
    const statusDisplay = document.getElementById('status-display');

    client.on('connect', () => {
        statusDisplay.innerText = "Terhubung! Membaca data realtime dari awan...";
        statusDisplay.style.backgroundColor = "#065f46";
        statusDisplay.style.color = "#a7f3d0";
        
        document.getElementById('btn-nyala').disabled = false;
        document.getElementById('btn-mati').disabled = false;
        document.getElementById('btn-save').disabled = false;
        
        client.subscribe(topikStatus);
        client.subscribe(topikJadwalStatus);
        
        // Request status ter-update ke ESP8266
        client.publish(topikKontrol, "STATUS_REQ"); 
    });

    client.on('message', (topic, message) => {
        const pesan = message.toString();
        const jamSekarang = document.getElementById('live-clock').innerText;
        
        // Handler Status Lampu
        if (topic === topikStatus) {
            if (pesan === 'ON') {
                dotElement.className = 'indicator-dot status-on';
                textElement.innerText = "STATUS: ON";
                textElement.style.color = "#10b981";
                statusDisplay.innerText = `Lampu Aktif Berhasil Disinkronkan (Jam ${jamSekarang})`;
            } else if (pesan === 'OFF') {
                dotElement.className = 'indicator-dot status-off';
                textElement.innerText = "STATUS: OFF";
                textElement.style.color = "#ef4444";
                statusDisplay.innerText = `Lampu Mati Berhasil Disinkronkan (Jam ${jamSekarang})`;
            }
        }
        
        // Handler Pengisian Form Waktu Berdasarkan Memori ESP8266 Realtime
        if (topic === topikJadwalStatus && pesan.startsWith("JADWAL")) {
            const bagian = pesan.split("|");
            let indexData = 1;
            
            for(let i = 1; i <= 4; i++) {
                const isiOn = bagian[indexData++];
                const isiOff = bagian[indexData++];
                
                document.getElementById(`on${i}`).value = (isiOn === "--:--") ? "" : isiOn;
                document.getElementById(`off${i}`).value = (isiOff === "--:--") ? "" : isiOff;
            }
            document.getElementById("sync-text").innerText = "✓ Form Jadwal Sinkron dengan Alat!";
            document.getElementById("sync-text").style.color = "#10b981";
        }
    });

    function kirimPerintah(perintah) {
        if (client.connected) {
            client.publish(topikKontrol, perintah);
        }
    }

    function simpanJadwal(event) {
        event.preventDefault();
        if (!client.connected) return;

        let dataJadwal = "JADWAL";
        for(let i = 1; i <= 4; i++) {
            let waktuOn = document.getElementById(`on${i}`).value || "--:--";
            let waktuOff = document.getElementById(`off${i}`).value || "--:--";
            dataJadwal += `|${waktuOn}|${waktuOff}`;
        }

        client.publish(topikKontrol, dataJadwal, { qos: 1, retain: true });
        document.getElementById("sync-text").innerText = "Mengirim jadwal baru ke alat...";
        document.getElementById("sync-text").style.color = "#38bdf8";
    }
</script>
</body>
</html>
