<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 Rizqy TOI 1 - Cloud Control Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 450px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); margin-bottom: 20px; text-align: center; }
        h2 { font-size: 22px; font-weight: 700; color: #00f2fe; }
        h3 { font-size: 16px; font-weight: 600; color: #38bdf8; margin: 15px 0; text-align: left; }
        hr { border: 0; height: 1px; background: #334155; margin: 15px 0; }
        .clock-box { font-size: 32px; font-weight: 800; color: #00f2fe; background: #0f172a; padding: 12px; border-radius: 10px; margin: 10px 0; font-family: monospace; border: 1px solid #334155; letter-spacing: 2px; }
        .status-koneksi { font-size: 12px; color: #94a3b8; margin-top: 5px; font-style: italic; }
        .indicator-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; font-weight: 700; text-align: left; padding: 0 10px; }
        .indicator-row { display: flex; align-items: center; gap: 12px; }
        .indicator-dot { width: 16px; height: 16px; border-radius: 50%; background-color: #64748b; flex-shrink: 0; transition: 0.3s; }
        .status-on { background-color: #10b981; box-shadow: 0 0 12px #10b981; }
        .status-off { background-color: #ef4444; box-shadow: 0 0 12px #ef4444; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer; border: none; color: white; transition: 0.2s; }
        .btn-on { background: #10b981; } .btn-off { background: #ef4444; }
        .btn-submit { background: linear-gradient(to right, #00f2fe, #4facfe); width: 100%; margin-top: 15px; color: #0f172a; font-weight: 700; }
        .timer-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 10px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; gap: 5px; }
        .timer-row span { font-weight: 600; font-size: 13px; min-width: 45px; text-align: left; }
        .timer-row label { font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .timer-row input[type='time'] { padding: 5px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 6px; outline: none; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>🌐 RIZQY-PROJECT TOI 1 (ONLINE)</h2>
        <div class='clock-box' id='live-clock'>00:00:00</div>
        <div class="status-koneksi" id="mqtt-status">Menghubungkan ke Broker Online...</div>
        <hr>
        <div class="indicator-container">
            <div class='indicator-row'>
                <span class='indicator-dot status-off' id='dot-manual'></span>
                <span id='text-manual' style='color:#ef4444'>STATUS MANUAL: LOADING...</span>
            </div>
            <div class='indicator-row'>
                <span class='indicator-dot status-off' id='dot-otomatis'></span>
                <span id='text-otomatis' style='color:#ef4444'>STATUS OTOMATIS: LOADING...</span>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-on" onclick="publishKontrol('ON')">NYALAKAN</button>
            <button class="btn btn-off" onclick="publishKontrol('OFF')">MATIKAN</button>
        </div>
        <hr>
        <h3>⚙️ PENGATURAN JADWAL OTOMATIS (ONLINE)</h3>
        <form id="form-jadwal" onsubmit="simpanJadwalCloud(event)">
            <div id="container-timer">
                </div>
            <button type="submit" class="btn btn-submit">💾 SIMPAN SEMUA JADWAL KE ALAT</button>
        </form>
    </div>
</div>

<script>
    const MQTT_BROKER = "broker.emqx.io";
    const MQTT_PORT = 8084; 
    const TOPIC_CONTROL = "rizqy_toi1_secure_control_77";
    const TOPIC_STATUS = "rizqy_toi1_secure_status_77";
    const TOPIC_JADWAL = "rizqy_toi1_secure_jadwal_77";

    let statusOtomatisAktif = false; 
    let statusManual = "OFF";
    let listJadwalON = [];
    let listJadwalOFF = [];

    // FITUR: Jam Digital Real-Time Berjalan
    const waktuLokal = new Date();
    let jam = waktuLokal.getHours();
    let menu = waktuLokal.getMinutes();
    let detik = waktuLokal.getSeconds();
    
    setInterval(() => {
         detik++;
         if(detik >= 60) { detik = 0; menu++; }
         if(menu >= 60) { menu = 0; jam++; }
         if(jam >= 24) { jam = 0; }
         document.getElementById('live-clock').innerText = String(jam).padStart(2, '0') + ':' + String(menu).padStart(2, '0') + ':' + String(detik).padStart(2, '0');
    }, 1000);

    // Generate Form Input Timer
    const containerTimer = document.getElementById('container-timer');
    for (let i = 0; i < 4; i++) {
        containerTimer.innerHTML += `
            <div class='timer-row'>
                <span>Set ${i+1}</span>
                <label>ON <input type='time' id='on${i}' onchange='updateJadwalLokal()'></label>
                <label>OFF <input type='time' id='off${i}' onchange='updateJadwalLokal()'></label>
            </div>
        `;
    }

    // Inisialisasi Paho MQTT Client
    const clientId = "WebClient-" + Math.floor(Math.random() * 10000);
    const client = new Paho.MQTT.Client(MQTT_BROKER, Number(MQTT_PORT), clientId);

    client.onConnectionLost = (responseObject) => {
        document.getElementById('mqtt-status').innerText = "Koneksi Terputus! Mencoba menghubungkan ulang...";
        document.getElementById('mqtt-status').style.color = "#ef4444";
        setTimeout(hubungkanMQTT, 3000);
    };

    client.onMessageArrived = (message) => {
        const topik = message.destinationName;
        const payload = message.payloadString;

        if (topik === TOPIC_STATUS) {
            cekApakahOtomatisAktif(payload);
            perbaruiTampilanDOM();
        } 
        else if (topik === TOPIC_JADWAL) {
            if (payload.startsWith("JADWAL")) {
                bongkarJadwalDariAlat(payload);
            }
        }
    };

    function hubungkanMQTT() {
        client.connect({
            onSuccess: () => {
                document.getElementById('mqtt-status').innerText = "Terhubung ke Cloud MQTT Server (OK)";
                document.getElementById('mqtt-status').style.color = "#10b981";
                client.subscribe(TOPIC_STATUS);
                client.subscribe(TOPIC_JADWAL);
                
                let reqMessage = new Paho.MQTT.Message("STATUS_REQ");
                reqMessage.destinationName = TOPIC_CONTROL;
                client.send(reqMessage);
            },
            onFailure: () => {
                document.getElementById('mqtt-status').innerText = "Gagal Terhubung ke Broker. Coba lagi...";
                setTimeout(hubungkanMQTT, 5000);
            },
            useSSL: true 
        });
    }

    function publishKontrol(cmd) {
        statusOtomatisAktif = false;
        statusManual = cmd;
        
        let message = new Paho.MQTT.Message(cmd);
        message.destinationName = TOPIC_CONTROL;
        client.send(message);
        
        perbaruiTampilanDOM();
    }

    function bongkarJadwalDariAlat(data) {
        const bagian = data.split('|');
        let indeksData = 1;
        listJadwalON = [];
        listJadwalOFF = [];

        for (let i = 0; i < 4; i++) {
            let jamOn = bagian[indeksData++];
            let jamOff = bagian[indeksData++];
            
            listJadwalON.push(jamOn);
            listJadwalOFF.push(jamOff);

            document.getElementById(`on${i}`).value = (jamOn === "--:--") ? "" : jamOn;
            document.getElementById(`off${i}`).value = (jamOff === "--:--") ? "" : jamOff;
        }
    }

    function updateJadwalLokal() {
        for (let i = 0; i < 4; i++) {
            listJadwalON[i] = document.getElementById(`on${i}`).value || "--:--";
            listJadwalOFF[i] = document.getElementById(`off${i}`).value || "--:--";
        }
    }

    function cekApakahOtomatisAktif(payloadStatusAlat) {
        const sekarangWaktu = `${String(jam).padStart(2, '0')}:${String(menu).padStart(2, '0')}`;
        let kecocokanOtomatis = false;

        if (payloadStatusAlat === "ON") {
            for (let i = 0; i < 4; i++) {
                if (listJadwalON[i] !== "--:--" && listJadwalON[i] === sekarangWaktu) {
                    kecocokanOtomatis = true;
                    break;
                }
            }
            if (kecocokanOtomatis) {
                statusOtomatisAktif = true;
                statusManual = "OFF";
            } else {
                if (!statusOtomatisAktif) {
                    statusManual = "ON";
                }
            }
        } 
        else if (payloadStatusAlat === "OFF") {
            for (let i = 0; i < 4; i++) {
                if (listJadwalOFF[i] !== "--:--" && listJadwalOFF[i] === sekarangWaktu) {
                    kecocokanOtomatis = true;
                    break;
                }
            }
            statusOtomatisAktif = false;
            statusManual = "OFF";
        }
    }

    function simpanJadwalCloud(event) {
        event.preventDefault();
        let payloadJadwal = "JADWAL";
        
        for (let i = 0; i < 4; i++) {
            let valOn = document.getElementById(`on${i}`).value || "--:--";
            let valOff = document.getElementById(`off${i}`).value || "--:--";
            payloadJadwal += `|${valOn}|${valOff}`;
        }

        let message = new Paho.MQTT.Message(payloadJadwal);
        message.destinationName = TOPIC_CONTROL;
        client.send(message);
        alert("Jadwal terkirim ke alat lewat Cloud!");
    }

    function perbaruiTampilanDOM() {
        const dotManual = document.getElementById('dot-manual');
        const textManual = document.getElementById('text-manual');
        if (statusManual === "ON") {
            dotManual.className = "indicator-dot status-on";
            textManual.innerText = "STATUS MANUAL: ON";
            textManual.style.color = "#10b981";
        } else {
            dotManual.className = "indicator-dot status-off";
            textManual.innerText = "STATUS MANUAL: OFF";
            textManual.style.color = "#ef4444";
        }

        const dotOto = document.getElementById('dot-otomatis');
        const textOto = document.getElementById('text-otomatis');
        if (statusOtomatisAktif) {
            dotOto.className = "indicator-dot status-on";
            textOto.innerText = "STATUS OTOMATIS: ON (BY SYSTEM)";
            textOto.style.color = "#10b981";
        } else {
            dotOto.className = "indicator-dot status-off";
            textOto.innerText = "STATUS OTOMATIS: OFF";
            textOto.style.color = "#ef4444";
        }
    }

    setInterval(() => {
        if(client.connected) {
            let reqMessage = new Paho.MQTT.Message("STATUS_REQ");
            reqMessage.destinationName = TOPIC_CONTROL;
            client.send(reqMessage);
        }
    }, 30000);

    hubungkanMQTT();
</script>
</body>
</html>
