<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIZQY-PROJECT IoT Control Center</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); text-align: center; }
        h2 { font-size: 22px; font-weight: 700; color: #00f2fe; margin-bottom: 5px; }
        h3 { font-size: 16px; font-weight: 600; color: #38bdf8; margin-top: 15px; margin-bottom: 15px; text-align: left; }
        hr { border: 0; height: 1px; background: #334155; margin: 15px 0; }
        
        .clock-box { font-size: 32px; font-weight: 800; color: #00f2fe; background: #0f172a; padding: 12px; border-radius: 10px; margin: 10px 0; font-family: 'Courier New', monospace; border: 1px solid #334155; letter-spacing: 2px; }

        .indicator-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px 0; font-weight: 700; font-size: 16px; }
        .indicator-dot { width: 20px; height: 20px; border-radius: 50%; background-color: #64748b; display: inline-block; transition: all 0.4s ease; }
        .status-on { background-color: #10b981; box-shadow: 0 0 15px #10b981; }
        .status-off { background-color: #ef4444; box-shadow: 0 0 15px #ef4444; }

        .btn-group { display: flex; justify-content: space-between; gap: 10px; }
        .btn { flex: 1; padding: 14px; font-size: 15px; font-weight: 700; text-align: center; border-radius: 8px; color: #0f172a; cursor: pointer; border: none; transition: all 0.2s ease; }
        .btn-on { background: linear-gradient(to right, #10b981, #059669); color: white; }
        .btn-off { background: linear-gradient(to right, #ef4444, #dc2626); color: white; }
        .btn-submit { background: linear-gradient(to right, #00f2fe, #4facfe); width: 100%; margin-top: 15px; color: #0f172a; font-weight: 700; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); opacity: 0.95; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        
        .status-box { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 15px; background-color: #334155; color: #cbd5e1; border: 1px solid #475569; }
        
        .timer-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 10px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; }
        .timer-row span { font-weight: 600; font-size: 14px; color: #e2e8f0; }
        .timer-row label { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 5px; }
        .timer-row input[type="time"] { padding: 6px; border: 1px solid #334155; background: #1e293b; color: white; border-radius: 6px; font-size: 13px; outline: none; }
        
        /* Box Notifikasi Jadwal */
        .sync-box { font-size: 13px; font-weight: 600; padding: 10px; border-radius: 6px; text-align: center; display: block; background: #0f172a; border: 1px solid #22d3ee; color: #22d3ee; margin-bottom: 10px; transition: all 0.3s ease; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🌐 RIZQY-PROJECT TOI 1</h2>
        <div class="clock-box" id="live-clock">00:00:00</div>
        <hr>
        
        <div class="indicator-container">
            <span id="lamp-dot" class="indicator-dot"></span>
            <span id="lamp-text">STATUS: SINKRONISASI...</span>
        </div>

        <div class="status-box" id="status-display">Menghubungkan ke Broker EMQX...</div>
        
        <div class="btn-group">
            <button onclick="kirimPerintah('ON')" class="btn btn-on" id="btn-nyala" disabled>NYALAKAN</button>
            <button onclick="kirimPerintah('OFF')" class="btn btn-off" id="btn-mati" disabled>MATIKAN</button>
        </div>
        
        <hr>
        <h3>⚙️ PENGATURAN JADWAL OTOMATIS</h3>
        
        <div class="sync-box" id="sync-text">Mencoba sinkronisasi jadwal dengan alat...</div>
        
        <form onsubmit="simpanJadwal(event)">
            <div class="timer-row"><span>Set 1</span><label>ON <input type="time" id="on1"></label><label>OFF <input type="time" id="off1"></label></div>
            <div class="timer-row"><span>Set 2</span><label>ON <input type="time" id="on2"></label><label>OFF <input type="time" id="off2"></label></div>
            <div class="timer-row"><span>Set 3</span><label>ON <input type="time" id="on3"></label><label>OFF <input type="time" id="off3"></label></div>
            <div class="timer-row"><span>Set 4</span><label>ON <input type="time" id="on4"></label><label>OFF <input type="time" id="off4"></label></div>
            <button type="submit" class="btn btn-submit" id="btn-save" disabled>💾 SIMPAN SEMUA JADWAL</button>
        </form>
    </div>
</div>

<script>
    // --- JAM DIGITAL ---
    setInterval(() => {
        const sekarang = new Date();
        document.getElementById('live-clock').innerText = String(sekarang.getHours()).padStart(2, '0') + ':' + String(sekarang.getMinutes()).padStart(2, '0') + ':' + String(sekarang.getSeconds()).padStart(2, '0');
    }, 1000);

    // --- MQTT CONFIGURATION ---
    const topikKontrol = "nepanled1";
    const topikStatus = "nepanled1/status"; 
    const topikJadwalStatus = "nepanled1/jadwal_status"; 
    
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", { clientId: "cl_rizqy_only_" + Math.random().toString(16).substr(2, 8) });

    let sedangMenyimpan = false; // Flag status penyimpanan

    client.on('connect', () => {
        document.getElementById('status-display').innerText = "Terhubung! Jalur Sinkron.";
        document.getElementById('status-display').style.backgroundColor = "#065f46";
        
        ['btn-nyala', 'btn-mati', 'btn-save'].forEach(id => {
            document.getElementById(id).disabled = false;
        });
        
        client.subscribe(topikStatus);
        client.subscribe(topikJadwalStatus);
        client.publish(topikKontrol, "STATUS_REQ"); 
    });

    client.on('message', (topic, message) => {
        const pesan = message.toString();
        
        if (topic === topikStatus) {
            const isOn = (pesan === 'ON');
            document.getElementById('lamp-dot').className = 'indicator-dot ' + (isOn ? 'status-on' : 'status-off');
            document.getElementById('lamp-text').innerText = "STATUS: " + pesan;
            document.getElementById('lamp-text').style.color = isOn ? "#10b981" : "#ef4444";
        }
        
        if (topic === topikJadwalStatus && pesan.startsWith("JADWAL")) {
            const b = pesan.split("|");
            let idx = 1;
            for(let i = 1; i <= 4; i++) {
                document.getElementById(`on${i}`).value = (b[idx] === "--:--" || !b[idx]) ? "" : b[idx]; idx++;
                document.getElementById(`off${i}`).value = (b[idx] === "--:--" || !b[idx]) ? "" : b[idx]; idx++;
            }
            
            // Cek jika data datang setelah user menekan tombol simpan
            if (sedangMenyimpan) {
                const box = document.getElementById("sync-text");
                box.innerText = "✓ Sukses! Jadwal Berhasil Tersimpan di Alat";
                box.style.color = "#10b981";
                box.style.borderColor = "#10b981";
                box.style.background = "#064e3b";
                
                sedangMenyimpan = false; // reset status

                // Setelah 4 detik balikkan tulisan ke normal
                setTimeout(() => {
                    box.innerText = "✓ Jadwal Terbaca & Sinkron!";
                    box.style.color = "#22d3ee";
                    box.style.borderColor = "#22d3ee";
                    box.style.background = "#0f172a";
                }, 4000);
            } else {
                document.getElementById("sync-text").innerText = "✓ Jadwal Terbaca & Sinkron!";
                document.getElementById("sync-text").style.color = "#22d3ee";
                document.getElementById("sync-text").style.borderColor = "#22d3ee";
                document.getElementById("sync-text").style.background = "#0f172a";
            }
        }
    });

    function kirimPerintah(perintah) {
        if (client.connected) client.publish(topikKontrol, perintah);
    }

    function simpanJadwal(event) {
        event.preventDefault();
        if (!client.connected) return;

        sedangMenyimpan = true; // Tandai bahwa user sedang memproses penyimpanan

        let dataJadwal = "JADWAL";
        for(let i = 1; i <= 4; i++) {
            dataJadwal += "|" + (document.getElementById(`on${i}`).value || "--:--") + "|" + (document.getElementById(`off${i}`).value || "--:--");
        }
        
        client.publish(topikKontrol, dataJadwal);
        
        // Ubah tampilan menjadi proses loading menunggu balasan ESP8266
        const box = document.getElementById("sync-text");
        box.innerText = "⏳ Sedang mengirim jadwal ke alat...";
        box.style.color = "#f59e0b";
        box.style.borderColor = "#f59e0b";
        box.style.background = "#78350f";
    }
</script>
</body>
</html>
